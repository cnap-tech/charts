name: Release Charts

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: akua-x64-ci-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install chart-releaser
        run: |
          CR_VERSION="1.6.1"
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz cr
          mkdir -p "${RUNNER_TEMP}/bin"
          mv cr "${RUNNER_TEMP}/bin/cr"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Build chart dependencies
        run: |
          for chart in $(find . -name Chart.lock -not -path './.git/*' -exec dirname {} \;); do
            echo "Building dependencies for $chart"
            helm dependency build "$chart"
          done

      # chart-releaser-action only discovers immediate children of charts_dir.
      # Our charts live in nested directories (app/, apps/openclaw/, gateways/*/),
      # so we find, package, and release them manually.
      - name: Package all charts
        run: |
          charts=$(find . -name Chart.yaml -not -path './.git/*' -exec dirname {} \; | sort)
          echo "Found charts:"
          echo "$charts"

          mkdir -p .cr-release-packages

          for chart in $charts; do
            echo "Packaging $chart"
            helm package "$chart" -d .cr-release-packages
          done

      - name: Create GitHub releases for new charts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const packages = fs
              .readdirSync('.cr-release-packages')
              .filter((name) => name.endsWith('.tgz'))
              .sort();

            for (const filename of packages) {
              const tag = filename.slice(0, -'.tgz'.length);

              try {
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag
                });
                core.info(`Release ${tag} already exists, skipping`);
                continue;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              core.info(`Creating release ${tag}`);
              const { data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true
              });

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: filename,
                data: fs.readFileSync(path.join('.cr-release-packages', filename))
              });
            }

      - name: Update Helm repo index
        run: |
          mkdir -p .cr-index

          cr index \
            --owner "${{ github.repository_owner }}" \
            --git-repo "${GITHUB_REPOSITORY#*/}" \
            --pages-branch gh-pages \
            --push \
            --release-name-template '{{ .Name }}-{{ .Version }}'

      - name: Sync artifacthub-repo.yml to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout main -- artifacthub-repo.yml
          git add artifacthub-repo.yml
          if git diff --cached --quiet; then
            echo "artifacthub-repo.yml unchanged"
          else
            git commit -m "chore: sync artifacthub-repo.yml from main"
            git push origin gh-pages
          fi
